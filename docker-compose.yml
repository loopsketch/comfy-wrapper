services:
  # 手元から API を叩く側。**通常は cw が直接ホストで動かすので出番は無い。**
  # ホストに python を入れられない環境と、cw run の -- のあとがここを使う。
  #   docker compose run --rm client src/scripts/generate_video.py
  # サーバ本体 (src/server/) は Colab 側で動くのでこのイメージには入らない。
  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    image: comfy-wrapper-client:latest
    volumes:
      - ./:/app
    env_file:
      - path: .env
        required: false
    working_dir: /app
    user: "1000:1000"
    environment:
      HOME: /tmp
    entrypoint: ["python"]

  # Colab のランタイム制御 (google-colab-cli)。ホストを汚さないためコンテナに閉じる。
  #
  #   docker compose up -d colab            常駐させる(先にこれ)
  #   src/scripts/colab.sh new -s comfy --gpu L4
  #
  # **常駐させること。** colab new は keep-alive デーモンを detached な子プロセスとして
  # spawn するので、docker compose run --rm で叩くとコマンド終了でコンテナごと消え、
  # ランタイムがアイドル刈り取りされる。
  #
  # 常駐中は entrypoint が OAuth の延長ループを回す。回していないと半日で切れ、
  # 切れている間はランタイムの確認も停止もできない。
  #
  # トークンと SSH 鍵は .colab/ に残る(git 管理外)。
  colab:
    build:
      context: .
      dockerfile: docker/Dockerfile.colab
    image: comfy-wrapper-colab:latest
    volumes:
      - ./:/app
    working_dir: /app
    user: "1000:1000"
    environment:
      HOME: /app/.colab
      # 監視のログを手元と同じ時刻で書く(既定の UTC だと読み違える)
      TZ: ${TZ:-Asia/Tokyo}
      COLAB_AUTH_LOOP_MINUTES: ${COLAB_AUTH_LOOP_MINUTES:-30}
    entrypoint: ["/app/src/scripts/colab_entrypoint.sh"]
    restart: unless-stopped
    # PID 1 を init にして、停止済み keep-alive デーモンのゾンビを刈る
    init: true

  # Colab 側の 8000(API) を ssh -L でこのコンテナへ通す常駐トンネル。
  #   docker compose up -d tunnel
  # client からは http://tunnel:8000 で届くので、宛先は固定でよい。
  # ComfyUI は Colab 側で 127.0.0.1 に閉じたまま。
  tunnel:
    image: comfy-wrapper-colab:latest
    volumes:
      - ./:/app
    working_dir: /app
    user: "1000:1000"
    environment:
      HOME: /app/.colab
      COLAB_SESSION: ${COLAB_SESSION:-comfy}
    # **ホスト IP を省くと 0.0.0.0 になる。** ポートを足すときは必ず付ける
    ports:
      - "127.0.0.1:8000:8000"
    # **docker の restart に張り直しを任せない。** 1ランタイムにつき colab ssh は1本だけで、
    # 秒単位で叩き直すと Already-active SSH session (HTTP 429) で締め出される。
    # 待ちを入れた張り直しは colab_tunnel.sh が行う。
    entrypoint: ["/app/src/scripts/colab_tunnel.sh"]
    restart: unless-stopped
    # default はこの compose 内の client 用、comfy は他プロジェクト用。
    # 明示すると default が暗黙で付かなくなるので、両方書く。
    networks: [default, comfy]

# 他プロジェクトから生成だけを頼むための共有ネットワーク。参加すると宛先が
# http://tunnel:8000 のまま解決するので、呼ぶ側はコードも .env も変えなくてよい。
# ホストにポートを晒さずに済むのも、この経路を選ぶ理由。
#
# **external にしない。** external だと comfy-net が無い環境で compose ごと起動に
# 失敗し、このリポジトリ単体で動かせなくなる。名前を固定した非 external にしておけば、
# 先に上がった方が作り、あとから来た方がそれに乗る(呼ぶ側も同じ宣言を置く)。
#
# **自前生成サーバはこのリポジトリのものだけを動かす。** .colab/ の OAuth トークン・SSH 鍵・
# セッションの記録は1つしか持てず、複製すると Already-active SSH session (HTTP 429) や
# アイドル刈り取りの取り合いになる。呼ぶ側は colab / tunnel を自前で持たないこと。
networks:
  comfy:
    name: comfy-net
